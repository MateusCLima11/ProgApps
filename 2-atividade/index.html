<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Tricolor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img src="assets/logo.png" alt="Logo Calculadora" id="logoBahia">

    <div class="container">
        <h1>Operações do Sistema</h1>

        <label for="numero1">Digite o primeiro número:</label>
        <input type="number" id="numero1" placeholder="Ex.: 7">

        <label for="numero2">Digite o segundo número:</label>
        <input type="number" id="numero2" placeholder="Ex.: 14">

        <button id="btnCalcular">Calcular Operações</button>

        <div id="resultadoSoma"></div>
        <div id="resultadoProduto"></div>
        <div id="resultadoMedia"></div>
        <div id="resultadoMaiorMenor"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
